<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DUM DUM · visor</title>
<style>
  :root { --chrome: #3a3a3c; --bisel: #0e0e10; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #6f6f74;
    font: 500 11px/1.25 "JetBrains Mono", ui-monospace, monospace;
    color: #fff;
    display: flex;
    overflow: hidden;
  }
  /* Los controles van en columna: la altura es el recurso escaso aquí, y en
     horizontal se comían la que necesita el aparato. */
  .barra {
    flex: 0 0 auto;
    width: 132px;
    padding: 12px 10px;
    display: flex; flex-direction: column; gap: 5px;
    background: rgba(0,0,0,0.24);
    overflow-y: auto;
  }
  .barra h2 {
    font: inherit; text-transform: uppercase; letter-spacing: 0.08em;
    opacity: 0.5; margin: 10px 0 2px;
  }
  .barra h2:first-child { margin-top: 0; }
  button {
    font: inherit; color: #fff; cursor: pointer; text-align: left;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 6px;
    padding: 6px 9px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  button:hover { background: rgba(255,255,255,0.22); }
  button[aria-pressed="true"] { background: #ff001e; border-color: #ff001e; }
  .dato { margin-top: auto; padding-top: 12px; opacity: 0.55; line-height: 1.5; }

  /* Panel estrecho (la conversación ocupa la mitad de la ventana): la columna de
     controles se llevaba un tercio del ancho justo cuando menos sobra. Pasa a
     fila, y el aparato se queda con todo lo demás. */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .barra {
      width: 100%;
      flex-direction: row; flex-wrap: wrap; align-items: center;
      gap: 4px; padding: 7px 8px;
      overflow: visible;
    }
    .barra h2 { margin: 0 2px; }
    .barra h2:first-child { margin-left: 0; }
    button { padding: 4px 7px; }
    .dato { margin: 0 0 0 auto; padding: 0; }
  }

  /* Ajustado no necesita scroll, y además lo evita a propósito: al aparecer la
     barra de scroll el hueco se estrechaba, los controles pasaban de tres filas
     a cuatro, eso robaba 21px de alto y el aparato ya no cabía. Un bucle. */
  .escena { flex: 1 1 auto; display: grid; place-items: center; overflow: hidden; padding: 8px; }
  /* En 1:1 el aparato puede ser más grande que el hueco: se ancla arriba a la
     izquierda para que el scroll llegue a todo en vez de recortar por los dos
     lados a la vez. */
  .escena.uno { overflow: auto; place-items: start center; }
  .escena.uno.desborda { place-items: start start; }
  /* scale() no cambia el sitio que el elemento ocupa en el flujo: sin este
     envoltorio la escena seguía contando el alto sin escalar, generaba scroll y
     al centrar recortaba el aparato por arriba. El envoltorio SÍ mide lo
     escalado. */
  .marco { position: relative; flex: 0 0 auto; }
  .marco > .aparato { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .aparato {
    position: relative;
    background: var(--bisel);
    box-shadow: 0 0 0 2px var(--chrome), 0 30px 70px rgba(0,0,0,0.45);
    transform-origin: center center;
  }
  .escena.uno .aparato { transform-origin: top center; }

  /* ── Teléfono ─────────────────────────────────────────────── */
  .aparato.movil { padding: 11px; border-radius: 54px; }
  /* Botones físicos del lateral. */
  .aparato.movil::before, .aparato.movil::after {
    content: ""; position: absolute; width: 3px; background: var(--chrome); border-radius: 2px;
  }
  .aparato.movil::before { left: -3px; top: 120px; height: 62px; box-shadow: 0 78px 0 var(--chrome); }
  .aparato.movil::after  { right: -3px; top: 150px; height: 96px; }
  .movil .pantalla { border-radius: 43px; }

  /* ── Ordenador ────────────────────────────────────────────── */
  /* Bisel fino y una peana, para que se lea como un monitor y no como una caja
     suelta. La peana va fuera del alto medido: es decoración, y si contara, el
     cálculo de la escala dejaría el conjunto más pequeño de la cuenta. */
  .aparato.escritorio { padding: 10px; border-radius: 12px; }
  .escritorio .pantalla { border-radius: 4px; }
  .aparato.escritorio::after {
    content: ""; position: absolute; left: 50%; bottom: -14px;
    width: 130px; height: 14px; transform: translateX(-50%);
    background: var(--chrome); border-radius: 0 0 8px 8px;
  }

  .pantalla {
    position: relative; overflow: hidden; background: #fffaf3;
    display: flex; flex-direction: column;
  }
  iframe { display: block; border: 0; flex: 1 1 auto; }

  /* Franjas del teléfono. La pantalla NO es el viewport: arriba va la barra de
     estado y abajo la del gesto de inicio. Si el iframe ocupara los 844 enteros,
     la isla taparía la topbar de la web y parecería un fallo nuestro cuando en
     un iPhone real la página empieza por debajo. */
  .franja { flex: 0 0 auto; position: relative; background: #fffaf3; }
  .franja.estado { height: 59px; }
  .franja.home { height: 34px; }
  .isla {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 32px; background: #000; border-radius: 999px;
  }
  .gesto {
    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
    width: 138px; height: 5px; border-radius: 999px; background: rgba(0,0,0,0.32);
  }
  .hora {
    position: absolute; top: 20px; left: 34px;
    font: 600 15px/1 -apple-system, "Helvetica Neue", sans-serif;
    color: #ff001e; letter-spacing: 0.01em;
  }

  /* Franja del ordenador: la barra del navegador. Mismo papel que la barra de
     estado del móvil — descuenta del alto lo que en la vida real no es web. */
  .franja.navegador {
    height: 44px; background: #e8e8ea;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
  }
  .semaforo { display: flex; gap: 6px; flex: 0 0 auto; }
  .semaforo i { width: 11px; height: 11px; border-radius: 50%; background: #c6c6c8; }
  .semaforo i:nth-child(1) { background: #ff5f57; }
  .semaforo i:nth-child(2) { background: #febc2e; }
  .semaforo i:nth-child(3) { background: #28c840; }
  .url {
    flex: 1 1 auto; height: 24px; border-radius: 6px; background: #fff;
    display: flex; align-items: center; padding: 0 10px;
    font: 500 11px/1 "JetBrains Mono", ui-monospace, monospace; color: #55555a;
    overflow: hidden; white-space: nowrap;
  }
</style>
</head>
<body>

<div class="barra">
  <h2 id="rot-pantalla">Pantalla</h2>
  <div id="anchos" style="display:contents"></div>
  <h2>Aparato</h2>
  <button id="btn-movil">Móvil</button>
  <button id="btn-escritorio">Ordenador</button>
  <h2>Escala</h2>
  <button id="btn-ajuste">Que quepa</button>
  <button id="btn-uno">1:1 real</button>
  <h2>Ruta</h2>
  <button data-r="/locales/chamberi">Chamberí</button>
  <button data-r="/locales/bernabeu">Bernabéu</button>
  <button data-r="/locales">Locales</button>
  <button data-r="/menu">Carta</button>
  <button data-r="/eventos">Eventos</button>
  <button data-r="/">Home</button>
  <div class="dato" id="dato"></div>
</div>

<div class="escena" id="escena">
 <div class="marco" id="marco">
  <div class="aparato movil" id="aparato">
    <div class="pantalla" id="pantalla">
      <div class="franja estado" id="franja-sup"></div>
      <iframe id="vista" title="Vista de la web"></iframe>
      <div class="franja home" id="franja-inf"><div class="gesto"></div></div>
    </div>
  </div>
 </div>
</div>

<script>
  const escena = document.getElementById("escena");
  const aparato = document.getElementById("aparato");
  const marco = document.getElementById("marco");
  const pantalla = document.getElementById("pantalla");
  const vista = document.getElementById("vista");
  const dato = document.getElementById("dato");
  const franjaSup = document.getElementById("franja-sup");
  const franjaInf = document.getElementById("franja-inf");
  const contAnchos = document.getElementById("anchos");

  // Lo que en cada aparato NO es web: en el móvil la barra de estado y la del
  // gesto; en el ordenador, la barra del navegador. Descontarlo es lo que hace
  // que el alto del iframe sea el que de verdad ves.
  const APARATOS = {
    movil: {
      rotulo: "Pantalla",
      sup: 59, inf: 34,
      medidas: [[375, 812, "375 · SE"], [390, 844, "390 · 15"], [430, 932, "430 · Max"]]
    },
    escritorio: {
      rotulo: "Ventana",
      sup: 44, inf: 0,
      medidas: [[1280, 800, "1280 · Aire"], [1440, 900, "1440 · Pro"], [1920, 1080, "1920 · Monitor"]]
    }
  };

  let tipo = "movil", W = 390, H = 844, ruta = "/locales/chamberi", uno = false;

  function pintarAnchos() {
    const a = APARATOS[tipo];
    document.getElementById("rot-pantalla").textContent = a.rotulo;
    contAnchos.innerHTML = "";
    a.medidas.forEach(([w, h, txt]) => {
      const b = document.createElement("button");
      b.textContent = txt;
      b.onclick = () => { W = w; H = h; marcar(); ajustar(); };
      b.dataset.w = w;
      contAnchos.appendChild(b);
    });
  }

  function pintarFranjas() {
    const esMovil = tipo === "movil";
    aparato.className = "aparato " + tipo;
    franjaSup.className = "franja " + (esMovil ? "estado" : "navegador");
    franjaInf.style.display = esMovil ? "" : "none";
    franjaSup.innerHTML = esMovil
      ? '<span class="hora">22.39</span><div class="isla"></div>'
      : '<span class="semaforo"><i></i><i></i><i></i></span><span class="url" id="url"></span>';
  }

  // El escalado es SOLO visual: el iframe sigue midiendo W px de ancho, así que
  // la maquetación es exactamente la de ese aparato. En 1:1 no se escala nada y
  // el marco se desplaza, para poder juzgar tamaños de texto reales.
  function ajustar() {
    const a = APARATOS[tipo];
    const UTIL = H - a.sup - a.inf;
    pantalla.style.width = W + "px";
    pantalla.style.height = H + "px";
    vista.style.width = W + "px";
    vista.style.height = UTIL + "px";
    const url = document.getElementById("url");
    if (url) url.textContent = "dum-dum.es" + ruta;
    escena.classList.toggle("uno", uno);
    // Se mide a escala 1: offsetWidth/Height ignoran el transform, pero el
    // envoltorio no, y hay que darle el tamaño ya escalado.
    aparato.style.transform = "scale(1)";
    // El envoltorio se encoge a cero ANTES de medir: si ocupa sitio, la escena
    // tiene scroll mientras se mide y el hueco sale más corto de lo real.
    marco.style.width = marco.style.height = "0px";
    const noCabe = uno && aparato.offsetWidth > escena.clientWidth - 16;
    escena.classList.toggle("desborda", noCabe);
    let k = 1;
    if (!uno) {
      k = Math.min(1,
        (escena.clientHeight - 24) / aparato.offsetHeight,
        (escena.clientWidth - 16) / aparato.offsetWidth);
    }
    aparato.style.transform = "scale(" + k + ")";
    marco.style.width = Math.round(aparato.offsetWidth * k) + "px";
    marco.style.height = Math.round(aparato.offsetHeight * k) + "px";
    dato.textContent = W + " × " + UTIL + " de web"
      + (k < 1 ? " · vista al " + Math.round(k * 100) + "%" : " · tamaño real")
      + (noCabe ? " · no cabe: desplázate o ensancha el panel" : "");
  }

  function marcar() {
    document.querySelectorAll("button[data-w]").forEach(b =>
      b.setAttribute("aria-pressed", String(+b.dataset.w === W)));
    document.querySelectorAll("button[data-r]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.r === ruta)));
    document.getElementById("btn-movil").setAttribute("aria-pressed", String(tipo === "movil"));
    document.getElementById("btn-escritorio").setAttribute("aria-pressed", String(tipo === "escritorio"));
    document.getElementById("btn-uno").setAttribute("aria-pressed", String(uno));
    document.getElementById("btn-ajuste").setAttribute("aria-pressed", String(!uno));
  }

  function cambiarAparato(t) {
    if (tipo === t) return;
    tipo = t;
    // Se entra por la medida de en medio, que es la de referencia de cada uno.
    [W, H] = APARATOS[t].medidas[1];
    pintarAnchos(); pintarFranjas(); marcar(); ajustar();
  }
  document.getElementById("btn-movil").onclick = () => cambiarAparato("movil");
  document.getElementById("btn-escritorio").onclick = () => cambiarAparato("escritorio");

  document.querySelectorAll("button[data-r]").forEach(b => b.onclick = () => {
    ruta = b.dataset.r; vista.src = ruta; marcar(); ajustar();
  });
  document.getElementById("btn-uno").onclick = () => { uno = true; marcar(); ajustar(); };
  document.getElementById("btn-ajuste").onclick = () => { uno = false; marcar(); ajustar(); };
  addEventListener("resize", ajustar);

  pintarAnchos();
  pintarFranjas();
  vista.src = ruta;
  marcar();
  ajustar();
</script>
</body>
</html>
